<script>
/* built-in copy: used only when api.js is not found next to this page */
if (!window.KAPI) {
// KISAKALI backend client: the single place where the website talks to Supabase.
// Loaded after supabase-js and supabase-config.js. Defines window.KAPI.
// If the config is empty, KAPI.live is false and every page shows a "not connected" message.
(function () {
  var C = window.KISAKALI_CONFIG || {};
  var live = !!(C.SUPABASE_URL && C.SUPABASE_ANON_KEY && window.supabase && window.supabase.createClient);
  var sb = live ? window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
  }) : null;

  // Calls a database function and turns {error} into a thrown Error with a readable message.
  function rpc(name, args) {
    if (!sb) return Promise.reject(new Error('The shop is not connected yet.'));
    return sb.rpc(name, args || {}).then(function (r) {
      if (r.error) throw new Error(r.error.message || 'Request failed');
      return r.data;
    });
  }


  /* If the connection cannot start, say exactly why (red bar at the top of the page) so it can be fixed fast. */
  if (!live) {
    var why = !window.KISAKALI_CONFIG ? "supabase-config.js did not load. It must be in the SAME folder as this page (check the file name and spelling)."
      : (!C.SUPABASE_URL || !C.SUPABASE_ANON_KEY) ? "supabase-config.js is empty. Fill in SUPABASE_URL and SUPABASE_ANON_KEY."
      : !window.supabase ? "The Supabase library could not be downloaded (both cdn.jsdelivr.net and unpkg.com failed). Check the internet connection, data saver or ad-blocker, then refresh."
      : "The Supabase client could not start.";
    window.KAPI_WHY = why;
    var bar = function () {
      if (!document.body || document.getElementById("kapi-why")) return;
      var d = document.createElement("div"); d.id = "kapi-why";
      d.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:2147483647;background:#b00020;color:#fff;padding:10px 14px;font:13px/1.4 sans-serif;text-align:center";
      d.textContent = "Not connected: " + why + (location.protocol === "file:" ? " (You opened this as a file from your device. Open it from your website address instead.)" : "");
      document.body.appendChild(d);
    };
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bar); else bar();
  }

  window.KAPI = {
    live: live,
    sb: sb,
    rpc: rpc,
    placeOrder: function (payload) { return rpc('place_order', { p: payload }); },
    track: function (number, phone) { return rpc('track_order', { p_number: number, p_phone: phone }); },
    applyVendor: function (payload) { return rpc('submit_vendor_application', { p: payload }); },
    // delivery photos live in the public "delivery-proofs" bucket
    photoUrl: function (path) {
      if (!sb || !path) return '';
      return sb.storage.from('delivery-proofs').getPublicUrl(path).data.publicUrl;
    }
  };
})();

}
</script>
<script>
(function () {
  var sb = window.KAPI && KAPI.live ? KAPI.sb : null;
  var REC = {}, EXT = {}, PAYSET = null, PAYOK = false, KXOK = false, RF = {}, OQ = "", OF = "all";
  var ME = null, SHOP = null, ORDERS = [], PRODS = [], CATS = [], WALLET = null, DUES = null, PAYOUTS = [], MOVES = [], DET = {}, cur = "dashboard", editing = null, busy = false;

  function $(i) { return document.getElementById(i); }
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function money(n) { return Number(n || 0).toLocaleString("en-US") + " TSh"; }
  function toast(m) { var t = $("toast"); t.textContent = m; t.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(function () { t.style.display = "none"; }, 3200); }
  function msg(t) { $("lgMsg").textContent = t || ""; }
  function validPhone(p) { return /^(0|\+?255)[67]\d{8}$/.test(String(p || "").replace(/[\s-]/g, "")); }
  function fmtDate(d) { try { return new Date(d + "T00:00:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }); } catch (e) { return d || ""; } }
  function rpc(name, args) { return sb.rpc(name, args || {}).then(function (r) { if (r.error) throw new Error(r.error.message); return r.data; }); }
  function pill(t, c) { return '<span class="pill ' + (c || "") + '">' + esc(t) + "</span>"; }
  function tbl(h, rows) { return '<div style="overflow-x:auto"><table class="table-custom"><thead><tr>' + h.map(function (x) { return "<th>" + x + "</th>"; }).join("") + "</tr></thead><tbody>" + rows.map(function (r) { return "<tr>" + r.map(function (c) { return "<td>" + c + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody></table></div>"; }

  /* ---------- rider delivery-fee confirmation helpers ---------- */
  var DELIVERY_KEYS = ["delivery_status", "order_status", "rider_status", "status"];
  function hasDeliveryInfo(o) {
    return o.delivered === true || o.delivered_at != null || DELIVERY_KEYS.some(function (k) { return o[k] !== undefined; });
  }
  function isDelivered(o) {
    if (o.delivered === true || o.delivered_at) return true;
    return DELIVERY_KEYS.some(function (k) { return /^delivered$/i.test(String(o[k] == null ? "" : o[k]).trim()); });
  }
  function riderFeePaid(o) { return !!(o.rider_fee_paid || o.rider_paid || o.rider_fee_paid_at || /^paid$/i.test(String(o.rider_payment_status || "").trim())); }
  function riderFeeAmount(o) { var f = o.delivery_fee != null ? o.delivery_fee : o.rider_fee; return f != null && f !== "" ? Number(f) : null; }
  function riderBlock(o, i) {
    if (!isDelivered(o)) return "";
    if (riderFeePaid(o)) {
      var when = o.rider_fee_paid_at ? " &middot; " + new Date(o.rider_fee_paid_at).toLocaleDateString("en-GB") : "";
      return '<div class="rider-box"><i class="fas fa-motorcycle" style="color:#FE980F"></i> ' + pill("Rider fee paid", "ok") + '<span class="line">' + when + "</span></div>";
    }
    var fee = riderFeeAmount(o);
    return '<div class="rider-box"><p class="line" style="margin-top:0"><i class="fas fa-motorcycle" style="color:#FE980F"></i> Delivered. The delivery fee' +
      (fee != null ? " of <b style=\"color:#FE980F\">" + money(fee) + "</b>" : "") + " is yours. Pay the rider, then confirm below.</p>" +
      '<button class="vb" data-act="riderpaid" data-i="' + i + '">Confirm I paid the rider</button></div>';
  }

  /* ---------- data ---------- */
  function loadMe(user) {
    return Promise.all([sb.from("profiles").select("full_name,phone,role").eq("id", user.id).maybeSingle(), rpc("vendor_my_shop").catch(function () { return null; })]).then(function (r) {
      var p = r[0].data || {};
      ME = { id: user.id, email: user.email || "", name: p.full_name || "", phone: p.phone || "", role: p.role || "" };
      SHOP = r[1];
    });
  }
  function loadAll() {
    return Promise.all([
      rpc("vendor_orders"),
      sb.from("products").select("id,title,description,price,stock,status,image,category:categories(slug,name)").eq("vendor_id", SHOP.id).neq("status", "archived").order("created_at", { ascending: false }),
      rpc("vendor_wallet"), rpc("vendor_payouts"),
      sb.from("categories").select("name,slug").order("id"),
      rpc("vendor_stock_moves").catch(function () { return []; }),
      rpc("vendor_product_details").catch(function () { return []; }),
      rpc("vendor_commission_dues").catch(function () { return null; })
    ]).then(function (r) {
      DUES = r[7];
      ORDERS = r[0] || [];
      if (r[1].error) throw new Error(r[1].error.message);
      PRODS = r[1].data || []; WALLET = r[2] || {}; PAYOUTS = r[3] || []; CATS = (r[4].data || []); MOVES = r[5] || [];
      DET = {}; (r[6] || []).forEach(function (d) { DET[String(d.id)] = d; });
    });
  }
  function refresh(keepEdit) { if (!keepEdit) editing = null; return loadAll().then(function () { show(cur); }).catch(function (e) { toast("Could not load: " + e.message); console.error(e); }); }
  function prodById(id) { return PRODS.filter(function (p) { return String(p.id) === String(id); })[0]; }
  function pname(id) { var p = prodById(id); return p ? p.title : "Removed product"; }
  function why(p) { var d = DET[String(p.id)]; return d && d.rejection_reason ? d.rejection_reason : ""; }

  function customText(c) {
    if (!c || typeof c !== "object") return "";
    var p = []; if (c.variant) p.push(c.variant); if (c.flavor) p.push(c.flavor);
    if (c.addons && c.addons.length) p.push("+ " + c.addons.join(", "));
    var t = p.join(" / "); if (c.cake_message) t += (t ? " | " : "") + "On the cake: " + c.cake_message;
    if (c.inscription) t += (t ? " | " : "") + "Card: " + c.inscription; return t;
  }
  var STATUS = { draft: ["Draft", ""], submitted: ["Waiting for review", "wait"], approved: ["Approved - tap Publish", "wait"], published: ["Live in the shop", "ok"], rejected: ["Rejected - edit and send again", "bad"] };
  function ostat(o) {
    if (o.payment_status !== "Verified") return o.payment_status === "Failed" ? "Payment failed" : "Awaiting payment";
    if (isDelivered(o)) return "Completed";
    return o.vendor_status === "Ready" ? "Ready for pickup" : "Preparing";
  }
  function ostatPill(o) { var s = ostat(o); return pill(s, s === "Completed" || s === "Ready for pickup" ? "ok" : /failed/.test(s) ? "bad" : "wait"); }
  function track(raw) {
    if (raw === "rejected") return '<div class="trk"><span class="bad">Rejected</span> <span>&rsaquo; fix, then Resubmit</span></div>';
    var s = ["draft", "submitted", "approved", "published"], L = ["Draft", "Submitted", "Approved", "Published"], i = s.indexOf(raw);
    return '<div class="trk">' + L.map(function (l, k) { return '<span class="' + (k <= i ? "on" : "") + '">' + l + "</span>"; }).join(" &rsaquo; ") + "</div>";
  }

  /* ================= MEDIA SYSTEM (photos & videos) ================= */
  var VENDOR = "", MEDIA = [], STG = [], ERR = [], MP = "", MG = "", MV = "", MQ = "", MF = "all", PVI = 0, LBL = [], LBI = 0, PF = { imgs: [], vids: [], busy: false };
  var CDEF = { img: ["image/jpeg", "image/png", "image/webp"], vid: ["video/mp4", "video/webm", "video/quicktime"], imgMB: 5, vidMB: 50, maxImg: 10, maxVid: 3, quotaMB: 200 };
  var ACC_I = ".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp", ACC_V = ".mp4,.webm,.mov,video/mp4,video/webm,video/quicktime";
  function mcfg() { var c = {}, o = {}; try { c = JSON.parse(localStorage.getItem("kMediaCfg") || "{}"); } catch (e) { } for (var k in CDEF) o[k] = c[k] != null ? c[k] : CDEF[k]; return o; }
  var DB = null;
  function idb() { return new Promise(function (res, rej) { if (DB) return res(DB); if (typeof indexedDB === "undefined") return rej(new Error("no storage")); var t = setTimeout(function () { rej(new Error("Media storage timed out")); }, 4000); var r = indexedDB.open("kisakali_media", 1); r.onupgradeneeded = function () { r.result.createObjectStore("media", { keyPath: "id" }); }; r.onsuccess = function () { clearTimeout(t); DB = r.result; res(DB); }; r.onerror = function () { clearTimeout(t); rej(r.error); }; r.onblocked = function () { clearTimeout(t); rej(new Error("Media storage is blocked")); }; }); }

        '<label style="display:block;margin:8px 0"><input type="checkbox" id="sh-hol"' + (s.holiday ? " checked" : "") + '> Holiday mode</label>' +
        '<button class="vb" data-act="saveShop">Save</button></div>' +
        payBox() + kxWarn() + kbox("Shop customization", "fa-paint-brush", '<div class="fgrid"><div>Shop logo' + img(e.logo, "fa-store") + '<label class="vb grey">Choose logo<input type="file" accept="image/jpeg,image/png,image/webp" data-brand="logo" style="display:none"></label></div><div>Cover photograph' + img(e.cover, "fa-image") + '<label class="vb grey">Choose cover<input type="file" accept="image/jpeg,image/png,image/webp" data-brand="cover" style="display:none"></label></div></div>' +
          '<div class="fgrid"><div>Business location<input class="fi" id="ext-location" maxlength="200" value="' + esc(e.location) + '"></div><div>WhatsApp<input class="fi" id="ext-whatsapp" maxlength="60" value="' + esc(e.whatsapp) + '"></div><div>Facebook<input class="fi" id="ext-facebook" maxlength="200" value="' + esc(e.facebook) + '"></div><div>Instagram<input class="fi" id="ext-instagram" maxlength="200" value="' + esc(e.instagram) + '"></div><div>TikTok<input class="fi" id="ext-tiktok" maxlength="200" value="' + esc(e.tiktok) + '"></div></div>' +
          'Shop policies (returns, cancellations, delivery)<textarea class="ta" id="ext-policies" rows="3" maxlength="900">' + esc(e.policies) + '</textarea>Featured collections<input class="fi" id="ext-featured" maxlength="300" placeholder="e.g. Birthday cakes, Wedding hampers" value="' + esc(e.featured) + '"><button class="vb" data-act="extsave">Save customization</button>') +
        kbox("Onboarding status", "fa-clipboard-check", '<p class="line">' + steps.map(function (t, i) { return '<span style="' + (i <= upto ? "color:#FE980F;font-weight:bold" : "color:#777") + '">' + t + "</span>"; }).join(" &rsaquo; ") + '</p><p class="note-small">Current status: <b>' + esc(ap) + "</b>. Only KISAKALI can approve, restrict or suspend your shop and change your verification status.</p>");
    }
  };
  function duesBox() {
    if (!DUES) return "";
    var rows = DUES.rows || [];
    if (!rows.length && !Number(DUES.due) && !Number(DUES.paid)) return "";
    return kbox("Commission you owe KISAKALI (direct payments)",
      "fa-hand-holding-usd",
      '<div class="stat-grid"><div class="stat-card"><h5>Still to pay</h5><div class="num red">' + money(DUES.due) + '</div></div><div class="stat-card"><h5>Already paid</h5><div class="num green">' + money(DUES.paid) + "</div></div></div>" +
      '<p class="note-small">Orders paid straight to you. Pay KISAKALI this commission and keep the reference; KISAKALI marks it as paid.</p>' +
      (rows.length ? tbl(["Date", "Order", "Order value", "Commission", "Status", "Reference"], rows.map(function (x) { return [new Date(x.created_at).toLocaleDateString("en-GB"), esc(x.order_number), money(x.base_amount), money(x.amount), pill(x.status, x.status === "Paid" ? "ok" : "wait"), esc(x.paid_ref || "-")]; })) : ""));
  }
  var _pc = V.products; V.products = function () { return _pc() + V.stock(); };
  var PCH = ["Vodacom M-Pesa", "Tigo Pesa", "Airtel Money", "HaloPesa", "CRDB / NMB Bank Transfer"];
  function payBox() {
    if (!PAYOK) return kbox("How customers pay", "fa-wallet", '<p class="note-small">Payment settings are not switched on yet. KISAKALI needs to finish the database update first.</p>');
    var m = PAYSET.mode === "direct" ? "direct" : "platform", have = {};
    (PAYSET.channels || []).forEach(function (c) { have[c.channel] = c; });
    var rows = PCH.map(function (n, i) {
      var c = have[n] || {};
      return '<div class="fgrid" style="margin:6px 0"><div>' + esc(n) + ' number<input class="fi" data-pn="' + i + '" inputmode="tel" maxlength="20" placeholder="e.g. 0712345678" value="' + esc(c.number) + '"></div>' +
        '<div>Account name<input class="fi" data-pa="' + i + '" maxlength="60" placeholder="Name shown to the customer" value="' + esc(c.name) + '"></div></div>';
    }).join("");
    return kbox("How customers pay", "fa-wallet",
      '<label style="display:block;margin:8px 0"><input type="radio" name="pay-mode" value="direct"' + (m === "direct" ? " checked" : "") + '> <b>Customer pays me directly.</b> I receive the money myself and KISAKALI takes its 10% commission from me afterwards.</label>' +
      '<label style="display:block;margin:8px 0"><input type="radio" name="pay-mode" value="platform"' + (m === "platform" ? " checked" : "") + '> <b>Customer pays KISAKALI.</b> KISAKALI collects the payment, pays me, and keeps its 10% commission.</label>' +
      '<div id="pay-direct" style="display:' + (m === "direct" ? "block" : "none") + '"><p class="note-small">Fill in at least one. Customers will see these numbers when they order from your shop.</p>' + rows + '</div>' +
      '<p class="note-small">In both cases the delivery fee belongs to you. You pay the rider yourself.</p>' +
      '<button class="vb" data-act="savePay">Save payment settings</button>');
  }
  var T = [["dashboard", "fa-home", "Dashboard"], ["shop", "fa-store", "My Shop"], ["products", "fa-box-open", "Product Center"], ["media", "fa-photo-video", "Media Center"], ["orders", "fa-shopping-bag", "Order Center"], ["gifts", "fa-gift", "Gift & Surprise"], ["customers", "fa-comments", "Customer Relations"], ["wallet", "fa-wallet", "Finance & Wallet"], ["marketing", "fa-bullhorn", "Marketing Center"], ["staff", "fa-users", "Staff Management"], ["reports", "fa-chart-bar", "Reports"], ["settings", "fa-cog", "Settings & Support"]];
  function defaults() {
    var ids = PRODS.map(function (p) { return String(p.id); });
    [["MP"], ["MG"], ["MV"]].forEach(function (x) { });
    if (ids.indexOf(String(MP)) < 0) MP = ids[0] || "";
    if (ids.indexOf(String(MG)) < 0) MG = ids[0] || "";
    if (ids.indexOf(String(MV)) < 0) MV = ids[0] || "";
  }
  function show(k) {
    cur = k; defaults();
    $("tabs").innerHTML = T.map(function (t) { return '<button class="tab-btn' + (cur === t[0] ? " on" : "") + '" data-k="' + t[0] + '"><i class="fas ' + t[1] + '"></i>' + t[2] + "</button>"; }).join("");
    var warn = SHOP && SHOP.approval_status !== "approved" ? '<div class="warn">Your shop is <b>' + esc(SHOP.approval_status) + "</b>. Customers cannot see it until the admin approves it.</div>" : "";
    $("view").innerHTML = warn + V[k]();
    if (k === "products") pfDraw("");
  }

  /* ---------- actions ---------- */
  function run(p, ok, keepEdit) {
    if (busy) return; busy = true;
    p.then(function () { busy = false; if (ok) { toast(ok); klog(ok); } return refresh(keepEdit); }).catch(function (e) { busy = false; toast(e.message || "Something went wrong."); });
  }
  function shrink(file) {
    return new Promise(function (resolve, reject) {
      if (!/^image\//.test(file.type)) { reject(new Error("Choose a photo (JPG, PNG or WEBP).")); return; }
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function () {
        var s = Math.min(1, 1200 / Math.max(img.width, img.height)), c = document.createElement("canvas");
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        c.toBlob(function (b) { b ? resolve(b) : reject(new Error("Could not read the photo.")); }, "image/jpeg", 0.85);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("Could not read the photo.")); };
      img.src = url;
    });
  }
  function uploadPhoto(id, file) {
    if (busy) return; busy = true; toast("Uploading photo...");
    shrink(file).then(function (blob) {
      var path = SHOP.id + "/" + id + "-" + Date.now() + ".jpg";
      return sb.storage.from("product-images").upload(path, blob, { contentType: "image/jpeg", upsert: false }).then(function (u) {
        if (u.error) throw new Error("Photo upload failed. Check your connection and try again.");
        return rpc("vendor_set_product_image", { p_id: Number(id), p_url: sb.storage.from("product-images").getPublicUrl(path).data.publicUrl });
      });
    }).then(function () { busy = false; toast("Photo saved"); refresh(); }).catch(function (e) { busy = false; toast(e.message); });
  }
  function updateProd(id, body) {
    return rpc("vendor_update_product", { p_id: Number(id), p: { title: body.title, price: body.price, description: body.description } }).catch(function () { var b = Object.assign({ id: id }, body); return rpc("vendor_save_product", { p: b }); });
  }

  document.addEventListener("change", function (e) {
    var t = e.target, id = t.id, ph = t.getAttribute && t.getAttribute("data-photo");
    if (t.name === "pay-mode") { var pd = $("pay-direct"); if (pd) pd.style.display = t.value === "direct" ? "block" : "none"; return; }
    if (ph && t.files[0]) { uploadPhoto(ph, t.files[0]); return; }
    if (t.getAttribute && t.getAttribute("data-rep")) { replaceMedia(t.getAttribute("data-rep"), t.files[0]); return; }
    if (id === "mu-p") { MP = t.value; show(cur); } else if (id === "mg-p") { MG = t.value; show(cur); } else if (id === "mv-p") { MV = t.value; PVI = 0; show(cur); }
    else if (id === "f-img" || id === "f-cam") stage(t.files, "image"); else if (id === "f-vid" || id === "f-vcam") stage(t.files, "video");
    else if (id === "pf-img" || id === "pf-cam") { pfAdd(t.files, "image"); t.value = ""; }
    else if (id === "pf-vid" || id === "pf-vcam") { pfAdd(t.files, "video"); t.value = ""; }
  });
  document.addEventListener("input", function (e) { if (e.target.id === "ml-q") { MQ = e.target.value; $("mlBody").innerHTML = libRows(); } });
  $("lbx").addEventListener("click", function () { $("lb").style.display = "none"; });
  function lbShow() { if (!LBL.length) return; LBI = (LBI + LBL.length) % LBL.length; $("lbi").src = LBL[LBI]; }
  $("lbp").addEventListener("click", function () { LBI--; lbShow(); });
  $("lbn").addEventListener("click", function () { LBI++; lbShow(); });

  document.addEventListener("click", function (e) {
    var t = e.target.closest(".tab-btn"); if (t) { show(t.getAttribute("data-k")); return; }
    var mt = e.target.closest("[data-m]"); if (mt && ME && SHOP) { mact(mt.getAttribute("data-m"), mt.getAttribute("data-i")); return; }
    var pf = e.target.closest("[data-pf]");
    if (pf) { var q = pf.getAttribute("data-pf").split(":"), list = q[0] === "img" ? PF.imgs : PF.vids, s = list.splice(+q[1], 1)[0]; if (s) URL.revokeObjectURL(s.url); pfDraw(""); return; }
    var a = e.target.closest("[data-act]"); if (!a || !ME || !SHOP) return;
    var act = a.getAttribute("data-act"), id = a.getAttribute("data-id");
    if (kxAct(act, a)) return;
    if (act === "refresh") refresh();
    else if (act === "pfsubmit") pfSave(true);
    else if (act === "pfdraft") pfSave(false);
    else if (act === "ready") { var o = ORDERS[+a.getAttribute("data-i")]; if (o && confirm("Mark " + o.order_number + " as ready for the rider to collect?")) run(rpc("vendor_mark_ready", { p_number: o.order_number }), "Marked ready"); }
    else if (act === "directpaid") {
      var dop = ORDERS[+a.getAttribute("data-i")];
      if (dop && confirm("Confirm that the customer has paid you for " + dop.order_number + "? KISAKALI's commission will be recorded as a debt you owe.")) run(rpc("vendor_confirm_direct_payment", { p_number: dop.order_number }), "Payment confirmed. Commission recorded.");
    }
    else if (act === "riderpaid") {
      var ro = ORDERS[+a.getAttribute("data-i")];
      if (ro && confirm("Confirm that the rider has taken his delivery fee from the cash collected for " + ro.order_number + "?")) run(rpc("vendor_confirm_rider_paid", { p_number: ro.order_number }), "Rider payment confirmed");
    }
    else if (act === "editProd") { editing = prodById(id); show("products"); window.scrollTo(0, 0); }
    else if (act === "cancelProd") { editing = null; show("products"); }
    else if (act === "saveProd" || act === "saveResub") {
      var title = $("pr-title").value.trim(), price = $("pr-price").value;
      if (!title) { toast("Enter the product name."); return; }
      if (price === "" || Number(price) < 0) { toast("Enter a valid price."); return; }
      var body = { title: title, price: Number(price), category: $("pr-cat").value, description: $("pr-desc").value }, eid = editing.id;
      run(updateProd(eid, body).then(function () { if (act === "saveResub") return rpc("vendor_submit_product", { p_id: Number(eid) }); }), act === "saveResub" ? "Updated and resubmitted" : "Changes saved");
    }
    else if (act === "submit") run(rpc("vendor_submit_product", { p_id: Number(id) }), "Sent to the admin for review");
    else if (act === "publish") run(rpc("vendor_publish_product", { p_id: Number(id) }), "Product is live");
    else if (act === "archive") { if (confirm("Archive this product? It leaves your shop.")) run(rpc("vendor_archive_product", { p_id: Number(id) }), "Product archived"); }
    else if (act === "delProd") {
      if (!confirm("Delete " + pname(id) + " permanently?")) return;
      var dk = String(id);
      run(rpc("vendor_delete_product", { p_id: Number(id) }).catch(function () { return rpc("vendor_archive_product", { p_id: Number(id) }); }).then(function () {
        var gone = MEDIA.filter(function (m) { return m.pid === dk; });
        return Promise.all(gone.map(function (m) { if (m.url) URL.revokeObjectURL(m.url); return dbDel(m.id); })).then(function () { MEDIA = MEDIA.filter(function (m) { return m.pid !== dk; }); });
      }), "Product removed");
    }
    else if (act === "stock") {
      var ch = parseInt(prompt("Stock change: use + to add and - to remove (example 10 or -3)"), 10);
      if (!ch) return; var why2 = (prompt("Reason (example: new batch, damaged)") || "").trim(); if (!why2) { toast("A reason is required."); return; }
      run(rpc("vendor_adjust_stock", { p_id: Number(id), p_change: ch, p_reason: why2 }), "Stock updated");
    }
    else if (act === "ivok") {
      var q2 = parseInt($("iv-q").value, 10), r2 = $("iv-r").value.trim();
      if (!q2 || !r2) { toast("Enter a change and a reason"); return; }
      run(rpc("vendor_adjust_stock", { p_id: Number($("iv-p").value), p_change: q2, p_reason: r2 }), "Stock updated");
    }
    else if (act === "payout") {
      var amt = Number($("wd-amt").value); if (!amt || amt <= 0) { toast("Enter an amount."); return; }
      run(rpc("vendor_request_payout", { p_amount: amt }), "Withdrawal requested");
    }
    else if (act === "savePay") {
      var pm = (document.querySelector('input[name="pay-mode"]:checked') || {}).value || "platform", chs = [], bad = "";
      PCH.forEach(function (n, i) {
        var nu = document.querySelector('[data-pn="' + i + '"]').value.trim(), na = document.querySelector('[data-pa="' + i + '"]').value.trim();
        if (!nu && !na) return;
        if (!nu || !na) { bad = "For " + n + ", fill in both the number and the account name."; return; }
        chs.push({ channel: n, number: nu, name: na });
      });
      if (bad) { toast(bad); return; }
      if (pm === "direct" && !chs.length) { toast("Add at least one payment number."); return; }
      run(rpc("vendor_save_payment_settings", { p: { mode: pm, channels: chs } }), "Payment settings saved");
    }
    else if (act === "saveShop") {
      var ph = $("sh-phone").value.trim(); if (ph && !validPhone(ph)) { toast("Enter a valid shop phone, e.g. 0712345678."); return; }
      run(rpc("vendor_update_shop", { p: { shop_name: $("sh-name").value, phone: ph, hours: $("sh-hours").value, coverage: $("sh-cov").value, about: $("sh-about").value, paused: $("sh-paused").checked, holiday: $("sh-hol").checked } }).then(function () { return rpc("vendor_my_shop").then(function (s) { SHOP = s; }); }), "Shop saved");
    }
    else if (act === "saveProfile") {
      var name = $("pf-name").value.trim(), phone = $("pf-phone").value.replace(/[\s-]/g, "");
      if (name.length < 2) { toast("Enter your name."); return; }
      if (phone && !validPhone(phone)) { toast("Enter a valid phone number, e.g. 0712345678."); return; }
      sb.from("profiles").update({ full_name: name, phone: phone || null }).eq("id", ME.id).then(function (r) {
        if (r.error) { toast(/duplicate|unique/i.test(r.error.message) ? "That phone number is already used by another account." : "Could not save. Try again."); return; }
        ME.name = name; ME.phone = phone; $("who").textContent = SHOP.shop_name; toast("Saved");
      });
    }
    else if (act === "savePw") {
      var pw = $("pw-new").value; if (pw.length < 8) { toast("Use at least 8 characters."); return; }
      sb.auth.updateUser({ password: pw }).then(function (r) { if (r.error) toast(r.error.message); else { $("pw-new").value = ""; toast("Password updated"); } });
    }
  });

  /* ---------- login ---------- */
  $("lgGo").onclick = function () {
    var email = $("lgEmail").value.trim(), pass = $("lgPass").value;
    if (!/^\S+@\S+\.\S+$/.test(email) || !pass) { msg("Enter your email and password."); return; }
    var btn = $("lgGo"); btn.disabled = true; msg("");
    sb.auth.signInWithPassword({ email: email, password: pass }).then(function (r) {
      btn.disabled = false;
      if (r.error) { msg(/invalid login/i.test(r.error.message) ? "Wrong email or password." : r.error.message); return; }
      start(r.data.user);
    });
  };
  [$("lgEmail"), $("lgPass")].forEach(function (i) { i.addEventListener("keydown", function (e) { if (e.key === "Enter") $("lgGo").click(); }); });
  function reset() { REC = {}; EXT = {}; PAYSET = null; PAYOK = false; KXOK = false; ME = null; SHOP = null; MEDIA = []; STG = []; VENDOR = ""; $("login").style.display = "flex"; }
  $("logoutBtn").onclick = function () { sb.auth.signOut().then(function () { reset(); $("lgPass").value = ""; }); };
  function deny(text) { sb.auth.signOut().then(function () { reset(); msg(text); }); }

  function start(user) {
    loadMe(user).then(function () {
      if (!ME || ME.role !== "vendor") { deny("This account is not a vendor account."); return; }
      if (!SHOP) { deny("Your account is not linked to a shop yet. Contact the admin."); return; }
      $("login").style.display = "none";
      VENDOR = String(SHOP.id);
      $("who").textContent = SHOP.shop_name;
      $("shopTag").innerHTML = SHOP.approval_status === "approved" ? pill("Approved", "ok") : pill(SHOP.approval_status, "wait");
      return loadAll().catch(function (e) { toast("Could not load: " + e.message); console.error(e); }).then(function () { show("dashboard"); loadMedia().then(function () { if (cur === "media") show(cur); }); loadKx().then(function () { if (["dashboard", "shop", "gifts", "customers", "marketing", "staff", "settings"].indexOf(cur) > -1) show(cur); }); });
    });
  }

  /* ---------- boot ---------- */
  if (!sb) { msg("The vendor panel is not connected yet."); $("lgGo").disabled = true; return; }
  sb.auth.getSession().then(function (r) { if (r.data && r.data.session) start(r.data.session.user); });
})();
</script>
<script src="kx-extras.js"></script>
<script src="wa-group.js"></script>
</body>
</html>
