<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FE980F">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="/icon-192.png">
<title>Apply to Sell - Kisakali Shopping Mall</title>
<link rel="stylesheet" href="main.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>window.supabase || document.write('<script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"><\/script>');</script>
<script src="supabase-config.js"></script>
<script src="api.js"></script>
<script>
/* built-in copy: used only when api.js is not found next to this page */
if (!window.KAPI) {
// KISAKALI backend client: the single place where the website talks to Supabase.
// Loaded after supabase-js and supabase-config.js. Defines window.KAPI.
// If the config is empty, KAPI.live is false and every page shows a "not connected" message.
(function () {
  var C = window.KISAKALI_CONFIG || {};
  var live = !!(C.SUPABASE_URL && C.SUPABASE_ANON_KEY && window.supabase && window.supabase.createClient);
  var sb = live ? window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
  }) : null;

  // Calls a database function and turns {error} into a thrown Error with a readable message.
  function rpc(name, args) {
    if (!sb) return Promise.reject(new Error('The shop is not connected yet.'));
    return sb.rpc(name, args || {}).then(function (r) {
      if (r.error) throw new Error(r.error.message || 'Request failed');
      return r.data;
    });
  }


  /* If the connection cannot start, say exactly why (red bar at the top of the page) so it can be fixed fast. */
  if (!live) {
    var why = !window.KISAKALI_CONFIG ? "supabase-config.js did not load. It must be in the SAME folder as this page (check the file name and spelling)."
      : (!C.SUPABASE_URL || !C.SUPABASE_ANON_KEY) ? "supabase-config.js is empty. Fill in SUPABASE_URL and SUPABASE_ANON_KEY."
      : !window.supabase ? "The Supabase library could not be downloaded (both cdn.jsdelivr.net and unpkg.com failed). Check the internet connection, data saver or ad-blocker, then refresh."
      : "The Supabase client could not start.";
    window.KAPI_WHY = why;
    var bar = function () {
      if (!document.body || document.getElementById("kapi-why")) return;
      var d = document.createElement("div"); d.id = "kapi-why";
      d.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:2147483647;background:#b00020;color:#fff;padding:10px 14px;font:13px/1.4 sans-serif;text-align:center";
      d.textContent = "Not connected: " + why + (location.protocol === "file:" ? " (You opened this as a file from your device. Open it from your website address instead.)" : "");
      document.body.appendChild(d);
    };
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bar); else bar();
  }

  window.KAPI = {
    live: live,
    sb: sb,
    rpc: rpc,
    placeOrder: function (payload) { return rpc('place_order', { p: payload }); },
    track: function (number, phone) { return rpc('track_order', { p_number: number, p_phone: phone }); },
    applyVendor: function (payload) { return rpc('submit_vendor_application', { p: payload }); },
    // delivery photos live in the public "delivery-proofs" bucket
    photoUrl: function (path) {
      if (!sb || !path) return '';
      return sb.storage.from('delivery-proofs').getPublicUrl(path).data.publicUrl;
    }
  };
})();

}
</script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<header>
  <div class="container header-container">
    <div class="logo"><h1 style="color:#fff">KISAKALI<span style="color:#FE980F">SHOPPING MALL</span></h1></div>
    <nav><ul><li><a href="index.html" style="color:#fff">Home</a></li><li><a href="shop.html" style="color:#fff">Marketplace</a></li></ul></nav>
  </div>
</header>
<section class="container" style="padding:40px 0;max-width:600px">
  <h2 style="text-align:center;margin-bottom:6px">Apply to Sell on Kisakali &amp; Impulse Cakes</h2>
  <p style="text-align:center;color:#b3b1ae;font-size:13px;margin-bottom:20px">Our team reviews every application before your shop goes live.</p>
  <div class="ks-box" id="va-box">
    <div id="va-err"></div>
    <label>Shop name</label><input class="ks-input" id="va-shop" style="color:#363432">
    <label>Owner full name</label><input class="ks-input" id="va-owner" style="color:#363432">
    <label>Phone number</label><input class="ks-input" id="va-phone" placeholder="e.g. 0634172673" style="color:#363432">
    <label>What do you sell?</label>
    <select class="ks-input" id="va-cat" style="color:#363432"><option>Cakes &amp; Bakery</option><option>Flowers &amp; Bouquets</option><option>Surprise Boxes</option><option>Fashion</option><option>Electronics &amp; Beauty</option><option>Other</option></select>
    <label>Area / location</label><input class="ks-input" id="va-area" placeholder="e.g. Kibaoni, Ifakara" style="color:#363432">
    <button class="btn" id="va-go" style="width:100%;background:#FE980F;color:#0D0D0D;font-weight:bold;padding:12px;margin-top:10px">Submit application</button>
  </div>
</section>
<script>
(function () {
  function $(i) { return document.getElementById(i); }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function err(m) { $("va-err").innerHTML = '<div class="ks-err">' + esc(m) + "</div>"; }
  function done(owner, phone) {
    $("va-box").innerHTML = '<div style="text-align:center"><h3>Application received</h3><p style="color:#b3b1ae;margin-top:10px">Thank you, ' + esc(owner) + '. We will contact you on ' + esc(phone) + ' after review.</p></div>';
  }
  $("va-go").addEventListener("click", function () {
    var shop = $("va-shop").value.trim(), owner = $("va-owner").value.trim(), phone = $("va-phone").value.trim(), area = $("va-area").value.trim();
    if (!shop || !owner || !area) { err("Please fill in all fields."); return; }
    if (!/^(0|\+?255)[67]\d{8}$/.test(phone.replace(/[\s-]/g, ""))) { err("Enter a valid Tanzanian phone number, e.g. 0634172673."); return; }
    if (window.KAPI && KAPI.live) {
      $("va-go").disabled = true;
      KAPI.applyVendor({ shop_name: shop, owner_name: owner, phone: phone, category: $("va-cat").value, area: area })
        .then(function () { done(owner, phone); })
        .catch(function (e) { $("va-go").disabled = false; err(e.message || "Could not send your application."); });
      return;
    }
    err("The shop is not connected. Your application was NOT sent. Check your internet connection and try again.");
  });
})();
</script>
    <script src="brand.js"></script>
<script src="kx-extras.js"></script>
</body>
</html>
