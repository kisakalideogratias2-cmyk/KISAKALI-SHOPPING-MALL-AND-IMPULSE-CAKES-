<!DOCTYPE html>
<!-- NEW FILE: save as track.html in the same folder as the other pages -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FE980F">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="/icon-192.png">
<title>Track Your Order - Kisakali Shopping Mall</title>
<link rel="stylesheet" href="main.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>window.supabase || document.write('<script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"><\/script>');</script>
<script src="supabase-config.js"></script>
<script src="api.js"></script>
<script>
/* built-in copy: used only when api.js is not found next to this page */
if (!window.KAPI) {
// KISAKALI backend client: the single place where the website talks to Supabase.
// Loaded after supabase-js and supabase-config.js. Defines window.KAPI.
// If the config is empty, KAPI.live is false and every page shows a "not connected" message.
(function () {
  var C = window.KISAKALI_CONFIG || {};
  var live = !!(C.SUPABASE_URL && C.SUPABASE_ANON_KEY && window.supabase && window.supabase.createClient);
  var sb = live ? window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
  }) : null;

  // Calls a database function and turns {error} into a thrown Error with a readable message.
  function rpc(name, args) {
    if (!sb) return Promise.reject(new Error('The shop is not connected yet.'));
    return sb.rpc(name, args || {}).then(function (r) {
      if (r.error) throw new Error(r.error.message || 'Request failed');
      return r.data;
    });
  }


  /* If the connection cannot start, say exactly why (red bar at the top of the page) so it can be fixed fast. */
  if (!live) {
    var why = !window.KISAKALI_CONFIG ? "supabase-config.js did not load. It must be in the SAME folder as this page (check the file name and spelling)."
      : (!C.SUPABASE_URL || !C.SUPABASE_ANON_KEY) ? "supabase-config.js is empty. Fill in SUPABASE_URL and SUPABASE_ANON_KEY."
      : !window.supabase ? "The Supabase library could not be downloaded (both cdn.jsdelivr.net and unpkg.com failed). Check the internet connection, data saver or ad-blocker, then refresh."
      : "The Supabase client could not start.";
    window.KAPI_WHY = why;
    var bar = function () {
      if (!document.body || document.getElementById("kapi-why")) return;
      var d = document.createElement("div"); d.id = "kapi-why";
      d.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:2147483647;background:#b00020;color:#fff;padding:10px 14px;font:13px/1.4 sans-serif;text-align:center";
      d.textContent = "Not connected: " + why + (location.protocol === "file:" ? " (You opened this as a file from your device. Open it from your website address instead.)" : "");
      document.body.appendChild(d);
    };
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bar); else bar();
  }

  window.KAPI = {
    live: live,
    sb: sb,
    rpc: rpc,
    placeOrder: function (payload) { return rpc('place_order', { p: payload }); },
    track: function (number, phone) { return rpc('track_order', { p_number: number, p_phone: phone }); },
    applyVendor: function (payload) { return rpc('submit_vendor_application', { p: payload }); },
    // delivery photos live in the public "delivery-proofs" bucket
    photoUrl: function (path) {
      if (!sb || !path) return '';
      return sb.storage.from('delivery-proofs').getPublicUrl(path).data.publicUrl;
    }
  };
})();

}
</script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<header>
  <div class="container header-container">
    <div class="logo"><h1 style="color:#fff">KISAKALI<span style="color:#FE980F">SHOPPING MALL</span></h1></div>
    <nav><ul>
      <li><a href="index.html" style="color:#fff">Home</a></li>
      <li><a href="shop.html" style="color:#fff">Marketplace</a></li>
      <li><a href="track.html" style="color:#FE980F">Track Order</a></li>
    </ul></nav>
  </div>
</header>
<section class="container" style="padding:40px 0;max-width:650px">
  <h2 style="text-align:center;margin-bottom:20px">Track Your Order</h2>
  <div class="ks-box">
    <input class="ks-input" id="o-phone" placeholder="Phone number used for the order" style="color:#363432;display:none">
    <input class="ks-input" id="o-num" placeholder="Enter your order number, e.g. KS2611071234" style="color:#363432">
    <button class="btn" id="o-go" style="width:100%;background:#FE980F;color:#0D0D0D;font-weight:bold;padding:12px">Track</button>
  </div>
  <div id="o-result"></div>
</section>
<script>
(function () {
  var STEPS = ["Preparing", "Arranging", "Assigned to Rider", "Out for Delivery", "Delivered"];
  var LIVE = !!(window.KAPI && KAPI.live);
  function $(i) { return document.getElementById(i); }
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function money(n) { return Number(n || 0).toLocaleString("en-US") + " TSh"; }
  function err(m) { $("o-result").innerHTML = '<div class="ks-err">' + esc(m) + "</div>"; }
  function render(o) {
    var idx = Math.max(0, STEPS.indexOf(o.status));
    var photo = o.photo ? '<div class="ks-line"><span>Delivery photo</span></div><img src="' + esc(o.photo) + '" alt="Delivery photo" style="max-width:100%;border-radius:6px">' : "";
    $("o-result").innerHTML = '<div class="ks-box"><h3>Order ' + esc(o.number) + ' <span class="ks-badge">' + esc(o.status) + '</span></h3>' +
      '<div class="ks-steps">' + STEPS.map(function (s, i) { return '<div class="ks-step' + (i <= idx ? " done" : "") + '">' + s + "</div>"; }).join("") + "</div>" +
      '<div class="ks-line"><span>Payment</span><span>' + esc(o.payment) + "</span></div>" +
      (o.vendorsTotal ? '<div class="ks-line"><span>Vendors ready</span><span>' + o.vendorsReady + " / " + o.vendorsTotal + "</span></div>" : "") +
      (o.otp && o.status !== "Delivered" ? '<div class="ks-line"><span>Delivery code</span><span><b>' + esc(o.otp) + "</b></span></div>" : "") +
      photo +
      '<div class="ks-line"><span>Delivery</span><span>' + esc(o.date || "-") + " &middot; " + esc(o.time || "") + "</span></div>" +
      '<div class="ks-line total"><span>Total</span><span>' + money(o.total) + "</span></div></div>";
  }
  function show(num) {
    num = String(num || "").trim().toUpperCase();
    if (!num) { err("Enter your order number."); return; }
    if (LIVE) {
      var phone = $("o-phone").value.trim();
      if (!phone) { err("Enter the phone number you used when ordering."); return; }
      KAPI.track(num, phone).then(function (r) {
        render({ number: r.number, status: r.status, payment: r.payment, date: r.delivery_date, time: r.delivery_time, total: r.total,
          otp: r.otp, photo: KAPI.photoUrl(r.photo_path), vendorsReady: r.vendors_ready, vendorsTotal: r.vendors_total });
      }).catch(function () { err("Order not found. Check the order number and phone number."); });
      return;
    }
    err("The shop is not connected yet. Please try again later.");
  }
  if (LIVE) $("o-phone").style.display = "block";
  $("o-go").addEventListener("click", function () { show($("o-num").value); });
  var q = new URLSearchParams(location.search).get("o");
  if (q) { $("o-num").value = q; }
})();
</script>
    <script src="brand.js"></script>
<script src="kx-extras.js"></script>
</body>
</html>
