    <script>
        var shopVendor = (new URLSearchParams(location.search).get('vendor') || '').trim().toLowerCase();
        var shopVendorLabel = (new URLSearchParams(location.search).get('vendor') || '').trim();

        function setActive(btn) {
            document.querySelectorAll('.filter-btn').forEach(function (b) { b.classList.remove('active'); });
            if (btn) btn.classList.add('active');
        }

        function filterCat(category, btnElement) {
            setActive(btnElement);
            renderProducts(category);
        }

        // Hides cards that do not match the search box or the ?vendor= link. Runs after every render.
        function applyFilters() {
            var info = document.getElementById('result-info');
            if (typeof catalogState !== 'undefined' && catalogState !== 'ready') { if (info) info.textContent = ''; return; }
            var q = (document.getElementById('search-bar').value || '').trim().toLowerCase();
            var cards = document.querySelectorAll('#product-list .product-card');
            var shown = 0;
            cards.forEach(function (card) {
                var title = card.querySelector('h4').textContent.toLowerCase();
                var vendor = card.querySelector('p').textContent.trim().toLowerCase();
                var ok = (!q || title.indexOf(q) > -1 || vendor.indexOf(q) > -1) && (!shopVendor || vendor === shopVendor);
                card.style.display = ok ? '' : 'none';
                if (ok) shown++;
            });
            var old = document.getElementById('no-match'); if (old) old.remove();
            if (cards.length && !shown) {
                var m = document.createElement('p');
                m.id = 'no-match'; m.style.cssText = 'color:#b3b1ae;grid-column:1/-1;text-align:center;padding:40px;';
                m.textContent = 'No products match your search.';
                document.getElementById('product-list').appendChild(m);
            }
            if (info) info.textContent = cards.length ? shown + ' product' + (shown === 1 ? '' : 's') : '';
        }
        function searchProducts() { applyFilters(); }

        /* ---- links from the homepage: ?q= ?for= ?feeling= ?occasion= ?max= ---- */
        (function () {
            var P = new URLSearchParams(location.search);
            var KW = {
                'for': { him: ['men', 'man', 'him', 'father', 'baba', 'shirt', 'watch', 'perfume', 'wallet', 'belt', 'tie'], her: ['women', 'woman', 'her', 'lady', 'mama', 'dress', 'bag', 'jewel', 'flower', 'bouquet', 'perfume', 'rose'], boyfriend: ['men', 'man', 'him', 'love', 'heart', 'watch', 'perfume', 'wallet', 'chocolate'], girlfriend: ['love', 'heart', 'rose', 'flower', 'bouquet', 'teddy', 'bear', 'perfume', 'chocolate'], wife: ['love', 'heart', 'rose', 'flower', 'bouquet', 'anniversary', 'jewel', 'perfume'], husband: ['love', 'watch', 'perfume', 'shirt', 'tie', 'wallet', 'anniversary'], friends: ['friend', 'rafiki', 'mug', 'box', 'hamper', 'gift'], mother: ['mother', 'mama', 'mum', 'flower', 'bouquet', 'hamper'], father: ['father', 'baba', 'shirt', 'tie', 'watch', 'wallet'], kids: ['kid', 'child', 'toy', 'teddy', 'bear', 'balloon', 'candy', 'chocolate', 'cake'] },
                feeling: { love: ['love', 'heart', 'rose', 'romantic', 'valentine', 'chocolate'], 'thinking-of-you': ['flower', 'bouquet', 'card', 'box', 'hamper', 'plant'], apology: ['sorry', 'apolog', 'flower', 'teddy', 'bear', 'chocolate'], 'miss-you': ['miss', 'teddy', 'bear', 'photo', 'frame', 'pillow', 'mug'], sympathy: ['sympathy', 'lily', 'lilies', 'white', 'flower', 'wreath', 'plant'], congratulations: ['congrat', 'cake', 'balloon', 'flower', 'hamper'], 'thank-you': ['thank', 'flower', 'chocolate', 'hamper', 'box'] },
                occasion: { birthday: ['birthday', 'cake', 'balloon', 'hamper', 'teddy'], anniversary: ['anniversary', 'love', 'heart', 'rose', 'cake', 'chocolate'], wedding: ['wedding', 'cake', 'bouquet', 'ring'], graduation: ['graduat', 'cake', 'bouquet', 'teddy', 'hamper'], valentines: ['valentine', 'love', 'heart', 'rose', 'chocolate', 'teddy'], 'mothers-day': ['mother', 'mama', 'flower', 'bouquet', 'hamper'], christmas: ['christmas', 'xmas', 'hamper', 'cake'], 'just-because': ['flower', 'chocolate', 'hamper', 'box', 'teddy'] }
            };
            var q = (P.get('q') || '').trim(), maxP = Number(P.get('max')) || 0, type = '', slug = '';
            ['for', 'feeling', 'occasion'].forEach(function (k) { if (!type && P.get(k)) { type = k; slug = (P.get(k) || '').toLowerCase().replace(/[^a-z-]/g, ''); } });
            var words = type && KW[type][slug] ? KW[type][slug] : [];
            var pretty = slug.replace(/-/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); });
            var label = type === 'for' ? 'Gifts for ' + pretty : pretty + ' gifts';
            var sb = document.getElementById('search-bar'); if (q && sb) sb.value = q;
            var list = document.getElementById('product-list'), chip = document.createElement('div');
            chip.style.cssText = 'margin:0 0 14px;padding:10px 14px;background:#363432;border:1px solid #FE980F;border-radius:8px;color:#fff;font-size:13px;display:none';
            list.parentNode.insertBefore(chip, list);
            function priceOf(c) { var el = c.querySelector('.price'); return el ? Number(((el.textContent.match(/[\d,]+/) || ['0'])[0]).replace(/,/g, '')) : 0; }
            window.applyExtra = function () {
                if (typeof catalogState !== 'undefined' && catalogState !== 'ready') return;
                var cards = [].slice.call(document.querySelectorAll('#product-list .product-card')); if (!cards.length || (!maxP && !words.length)) return;
                var notes = [];
                if (maxP) { cards.forEach(function (c) { if (priceOf(c) > maxP) c.style.display = 'none'; }); notes.push('Under ' + maxP.toLocaleString('en-US') + ' TSh'); }
                if (words.length) {
                    var vis = cards.filter(function (c) { return c.style.display !== 'none'; });
                    var hit = vis.filter(function (c) { var t = c.querySelector('h4').textContent.toLowerCase(); return words.some(function (w) { return t.indexOf(w) > -1; }); });
                    if (hit.length) { vis.forEach(function (c) { if (hit.indexOf(c) < 0) c.style.display = 'none'; }); notes.push(label); }
                    else notes.push('No items are tagged for "' + pretty + '" yet, so you are seeing everything');
                }
                chip.style.display = 'block'; chip.textContent = notes.join(' - ') + '  ';
                var x = document.createElement('a'); x.href = 'shop.html'; x.style.color = '#FE980F'; x.textContent = 'Clear'; chip.appendChild(x);
                var shown = cards.filter(function (c) { return c.style.display !== 'none'; }).length;
                var old = document.getElementById('no-match'); if (old) old.remove();
                if (!shown) { var m = document.createElement('p'); m.id = 'no-match'; m.style.cssText = 'color:#b3b1ae;grid-column:1/-1;text-align:center;padding:40px;'; m.textContent = 'No products match this filter yet.'; list.appendChild(m); }
                var info = document.getElementById('result-info'); if (info) info.textContent = shown + ' product' + (shown === 1 ? '' : 's');
            };
            var base = applyFilters; applyFilters = function () { base(); window.applyExtra(); };
        })();

        // every render (from app.js or from the buttons) re-applies the search and shop filters
        (function () {
            var base = renderProducts;
            renderProducts = function (c) { base(c); applyFilters(); };
        })();

        if (shopVendorLabel) {
            var chip = document.getElementById('vendor-chip');
            chip.hidden = false;
            chip.appendChild(document.createTextNode('Showing products from '));
            var b = document.createElement('b'); b.style.color = '#FE980F'; b.textContent = shopVendorLabel; chip.appendChild(b);
            chip.appendChild(document.createTextNode(' '));
            var x = document.createElement('a'); x.href = 'shop.html'; x.style.color = '#FE980F'; x.textContent = 'Show all shops'; chip.appendChild(x);
        }

        // category buttons: only categories that have products on sale right now
        window.addEventListener('kisakali:catalog', function (e) {
            var list = (e.detail && e.detail.products) || [];
            if (!list.length) return;
            var have = {};
            list.forEach(function (p) { if (p.category) have[p.category] = true; });
            var box = document.getElementById('cat-buttons');

            function addButtons(cats) {
                cats.forEach(function (c) {
                    if (!have[c.slug]) return;
                    var btn = document.createElement('button');
                    btn.className = 'filter-btn'; btn.textContent = c.name;
                    btn.addEventListener('click', function () { filterCat(c.slug, btn); });
                    box.appendChild(btn);
                });
                var cur = new URLSearchParams(location.search).get('cat');
                if (cur && cur !== 'all') {
                    var idx = cats.filter(function (c) { return have[c.slug]; }).map(function (c) { return c.slug; }).indexOf(cur);
                    setActive(idx > -1 ? box.children[idx + 1] : null);
                }
            }

            var fallback = Object.keys(have).map(function (s) { return { slug: s, name: s.charAt(0).toUpperCase() + s.slice(1) }; });
            var sb = window.KAPI && KAPI.sb;
            if (!sb) { addButtons(fallback); return; }
            sb.from('categories').select('name,slug').order('id').then(function (r) {
                addButtons(!r.error && r.data && r.data.length ? r.data : fallback);
            }, function () { addButtons(fallback); });
        });
    </script>

<script>
/* ================= CART GUARD (fix) =================
   The cart is stored ONLY in localStorage key "kisakali_cart".
   This block makes the shop page always read that key fresh, draw the cart count and drawer itself,
   and never let any other script delete the saved cart. It works with old or new app.js. */
(function () {
  var KEY = 'kisakali_cart';
  function $(i) { return document.getElementById(i); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function money(n) { return Number(n || 0).toLocaleString('en-US') + ' TSh'; }
  function readCart() { try { var v = JSON.parse(localStorage.getItem(KEY)); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
  function writeCart(list) { try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) { console.warn('Could not save cart', e); } }
  function toast(m) {
    var t = document.createElement('div'); t.className = 'ks-toast'; t.textContent = m;
    document.body.appendChild(t); setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 2000);
  }
  function feePer() { return (typeof DELIVERY_FEE_PER_VENDOR === 'number') ? DELIVERY_FEE_PER_VENDOR : 3000; }
  function keyOf(it) { return String(it.key || it.productId || it.id); }

  function paint() {
    var list = readCart(), cnt = $('cart-count'), box = $('cart-items-container'), tot = $('cart-total-amount');
    var n = list.reduce(function (a, i) { return a + (i.qty || 1); }, 0);
    if (cnt) cnt.textContent = n;
    if (!box) return;
    if (!list.length) {
      box.innerHTML = '<p class="empty-msg" style="color:#b3b1ae;text-align:center;padding:20px;">Your cart is empty.</p>';
      if (tot) tot.textContent = '0 TSh';
      return;
    }
    var groups = {}, vendors = [], sub = 0;
    list.forEach(function (it, i) {
      var v = it.vendor || 'Other';
      if (!groups[v]) { groups[v] = []; vendors.push(v); }
      groups[v].push([it, i]);
      sub += Number(it.price) * (it.qty || 1);
    });
    var html = vendors.map(function (v) {
      return '<div class="ks-vendor-title"><i class="fas fa-store"></i> ' + esc(v) + '</div>' +
        groups[v].map(function (p) {
          var it = p[0], i = p[1], q = it.qty || 1;
          return '<div class="ks-cart-row"><div class="ks-cart-info"><h5>' + esc(it.name) + '</h5>' +
            (it.custom ? '<small>Customized gift</small>' : '') +
            '<span class="ks-price">' + money(Number(it.price) * q) + '</span></div>' +
            '<div class="ks-qty"><button type="button" onclick="ksQty(' + i + ',-1)">-</button><b>' + q + '</b>' +
            '<button type="button" onclick="ksQty(' + i + ',1)">+</button>' +
            '<i class="fas fa-trash-alt" onclick="removeItem(' + i + ')" title="Remove"></i></div></div>';
        }).join('');
    }).join('');
    var fee = vendors.length * feePer();
    html += '<div class="ks-sum"><span>Delivery (' + vendors.length + ' vendor' + (vendors.length > 1 ? 's' : '') + ')</span><span>' + money(fee) + '</span></div>';
    box.innerHTML = html;
    if (tot) tot.textContent = money(sub + fee);
  }

  /* Take over the cart functions. Every change reads the saved cart first, writes it back, then redraws. */
  window.updateCartDisplay = paint;
  window.saveAndRefreshCart = function () { paint(); };      /* old app.js used this to delete items; now it only redraws */
  window.addCartItem = function (item) {
    var cart = readCart();
    if (item.productId == null && item.id != null) item.productId = item.id;
    var k = keyOf(item), found = cart.filter(function (c) { return keyOf(c) === k; })[0];
    if (found) found.qty = (found.qty || 1) + 1; else { item.qty = item.qty || 1; cart.push(item); }
    writeCart(cart); paint();
  };
  window.ksQty = function (i, d) {
    var cart = readCart(); if (!cart[i]) return;
    cart[i].qty = Math.max(1, (cart[i].qty || 1) + d); writeCart(cart); paint();
  };
  window.removeItem = function (i) { var cart = readCart(); cart.splice(i, 1); writeCart(cart); paint(); };

  /* open / close the drawer (works even if app.js did not bind them) */
  var tg = $('cart-toggle'), cl = $('cart-close'), sd = $('cart-sidebar');
  if (tg) tg.addEventListener('click', function () { paint(); if (sd) sd.classList.add('open'); });
  if (cl) cl.addEventListener('click', function () { if (sd) sd.classList.remove('open'); });

  /* redraw whenever the page is shown, the catalog arrives, or another tab changes the cart */
  window.addEventListener('pageshow', paint);
  window.addEventListener('load', paint);
  window.addEventListener('kisakali:catalog', paint);
  window.addEventListener('storage', function (e) { if (e.key === KEY) paint(); });
  window.KS_CART = { read: readCart, write: writeCart, toast: toast };
  paint();
})();
</script>

<script>
/* KISAKALI standalone marketplace loader (safety net).
   If the normal loader has not filled the product list after a few seconds, this asks the database directly,
   draws the products, category buttons and search, and prints the exact reason if it still cannot.
   FIX: its cards now have a real "Add to Cart" button that saves to the same cart (kisakali_cart). */
(function () {
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function money(n) { return Number(n || 0).toLocaleString("en-US") + " TSh"; }
  function one(v) { return Array.isArray(v) ? (v[0] || null) : (v || null); }
  var items = [], curCat = "all", curQ = "";
  var grid = function () { return document.getElementById("product-list"); };
  function note(t) { var g = grid(); if (g) g.innerHTML = '<p style="color:#b3b1ae;grid-column:1/-1;text-align:center;padding:40px;">' + esc(t) + '</p>'; }
  function draw() {
    var q = curQ.toLowerCase().trim();
    var list = items.filter(function (x) {
      return (curCat === "all" || x.cat === curCat) && (!q || (x.title + " " + x.shop + " " + x.catName).toLowerCase().indexOf(q) > -1);
    });
    if (!list.length) { note(items.length ? "No products match your search or category." : "No products yet."); return; }
    grid().innerHTML = list.map(function (x) {
      var out = x.stock != null && x.stock <= 0;
      return '<div class="product-card" style="background:#363432;border:1px solid #444;padding:15px;border-radius:6px;text-align:center;color:#fff;">' +
        (x.image ? '<img src="' + esc(x.image) + '" alt="' + esc(x.title) + '" loading="lazy" style="width:100%;height:180px;object-fit:cover;border-radius:4px;">'
                 : '<div style="width:100%;height:180px;border-radius:4px;background:#2b2927;display:flex;align-items:center;justify-content:center;color:#FE980F;font-size:32px;"><i class="fas fa-gift"></i></div>') +
        '<h4 style="margin:10px 0 5px;font-size:15px;color:#fff;">' + esc(x.title) + '</h4>' +
        (x.shop ? '<p style="font-size:12px;color:#b3b1ae;margin-bottom:8px;"><i class="fas fa-store" style="color:#FE980F;"></i> ' + esc(x.shop) + '</p>' : '') +
        '<div class="price" style="color:#FE980F;font-weight:bold;font-size:16px;margin-bottom:12px;">' + money(x.price) + '</div>' +
        (out ? '<button class="btn" disabled style="background:#555;color:#ccc;width:100%;font-weight:bold;">Out of stock</button>'
             : '<button type="button" class="btn" data-ksadd="' + esc(x.id) + '" style="display:block;width:100%;background:#FE980F;color:#0D0D0D;font-weight:bold;padding:10px;border:0;border-radius:4px;margin-bottom:8px;cursor:pointer;">Add to Cart</button>' +
               '<a href="product-details.html?id=' + encodeURIComponent(x.id) + '" style="font-size:12px;color:#FE980F;text-decoration:none;"><i class="fas fa-sliders-h"></i> Customize</a>') +
        '</div>';
    }).join("");
  }
  function buttons() {
    var box = document.getElementById("cat-buttons"); if (!box) return;
    var seen = {}, html = '<button class="filter-btn' + (curCat === "all" ? " active" : "") + '" data-rc="all">All Categories</button>';
    items.forEach(function (x) { if (x.cat && !seen[x.cat]) { seen[x.cat] = 1; html += '<button class="filter-btn' + (curCat === x.cat ? " active" : "") + '" data-rc="' + esc(x.cat) + '">' + esc(x.catName) + '</button>'; } });
    box.innerHTML = html;
    box.onclick = function (e) { var b = e.target.closest("[data-rc]"); if (!b) return; curCat = b.getAttribute("data-rc"); buttons(); draw(); };
  }
  async function run() {
    var g = grid(); if (!g || g.querySelector(".product-card")) return;           /* normal loader worked */
    var txt = (g.innerText || "").trim();
    if (txt && !/^Loading/i.test(txt) && !/^Could not load/i.test(txt) && !/not connected/i.test(txt)) return; /* a real message is already shown */
    var C = window.KISAKALI_CONFIG || {};
    if (!C.SUPABASE_URL || !C.SUPABASE_ANON_KEY) { note("Products cannot load: connection settings are missing."); return; }
    var base = C.SUPABASE_URL.replace(/\/+$/, "") + "/rest/v1/", H = { apikey: C.SUPABASE_ANON_KEY, Authorization: "Bearer " + C.SUPABASE_ANON_KEY };
    var P = new URLSearchParams(location.search);
    curCat = (P.get("cat") || "all").toLowerCase(); curQ = P.get("q") || P.get("search") || "";
    var sb = document.getElementById("search-bar"); if (sb && curQ) sb.value = curQ;
    try {
      var sel = "id,title,price,image,stock,vendor_id,category:categories(slug,name)";
      var r = await fetch(base + "products?select=" + encodeURIComponent(sel) + "&is_active=eq.true&status=eq.published&order=created_at.desc", { headers: H });
      if (!r.ok) r = await fetch(base + "products?select=id,title,price,image,stock,vendor_id&is_active=eq.true&status=eq.published&order=created_at.desc", { headers: H });
      if (!r.ok) { var m = ""; try { m = (await r.json()).message || ""; } catch (e) {} note("Database answered with error " + r.status + (m ? ": " + m : "") + ". Check the products table and its read rules (RLS)."); return; }
      var rows = await r.json();
      if (!rows.length) { note("The database has no published products yet. Publish at least one product (status = published, active) from a shop that is approved."); return; }
      var shops = {};
      try {
        var ids = Array.from(new Set(rows.map(function (x) { return x.vendor_id; }).filter(Boolean)));
        if (ids.length) { var vr = await fetch(base + "vendors?select=id,shop_name,paused,holiday&id=in.(" + ids.join(",") + ")", { headers: H }); if (vr.ok) (await vr.json()).forEach(function (v) { shops[v.id] = v; }); }
      } catch (e) {}
      items = rows.filter(function (x) { var v = shops[x.vendor_id]; return !v || (!v.paused && !v.holiday); }).map(function (x) {
        var c = one(x.category) || {}, v = shops[x.vendor_id] || {};
        return { id: x.id, title: x.title, price: x.price, image: x.image, stock: x.stock, shop: v.shop_name || "", cat: String(c.slug || "").toLowerCase(), catName: c.name || "" };
      });
      if (!items.length) { note("All shops that own these products are paused or on holiday."); return; }
      window.filterCat = function (c) { curCat = c; buttons(); draw(); };
      window.searchProducts = function () { var s = document.getElementById("search-bar"); curQ = s ? s.value : ""; draw(); };
      /* Add to Cart for the cards drawn by this safety net */
      if (!g.getAttribute("data-ksadd-bound")) {
        g.setAttribute("data-ksadd-bound", "1");
        g.addEventListener("click", function (e) {
          var b = e.target.closest("[data-ksadd]"); if (!b) return;
          var id = b.getAttribute("data-ksadd"), x = items.filter(function (i) { return String(i.id) === String(id); })[0];
          if (!x) return;
          if (x.stock != null && x.stock <= 0) { if (window.KS_CART) KS_CART.toast("Out of stock"); return; }
          window.addCartItem({ id: x.id, productId: x.id, name: x.title, price: Number(x.price), img: x.image || "", vendor: x.shop || "KISAKALI Seller", category: x.cat });
          var sd = document.getElementById("cart-sidebar"); if (sd) sd.classList.add("open");
          if (window.KS_CART) KS_CART.toast("Added to cart");
        });
      }
      buttons(); draw();
    } catch (e) { note("Cannot reach the database from this device (" + (e && e.message || e) + "). Check the internet connection, data saver or ad-blocker."); }
  }
  window.addEventListener("load", function () { setTimeout(run, 3500); });
})();
</script>
