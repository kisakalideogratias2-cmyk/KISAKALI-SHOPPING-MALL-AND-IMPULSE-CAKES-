
<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0D0D0D; color: #FFFFFF; }
        header { background-color: #363432 !important; border-bottom: 1px solid #444; }
        .logo h1 { color: #FFFFFF; }
        .logo h1 span { color: var(--accent,#FE980F); }
        nav ul li a { color: #FFFFFF !important; }
        nav ul li a.active, nav ul li a:hover { color: var(--accent,#FE980F) !important; }

        .admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .metric-card { background: #363432; border: 1px solid #444; padding: 20px; border-radius: 6px; border-left: 4px solid var(--accent,#FE980F); }
        .metric-card h4 { font-size: 13px; color: #b3b1ae; margin-bottom: 8px; }
        .metric-card .value { font-size: 24px; font-weight: bold; color: var(--accent,#FE980F); }

        .section-box { background: #363432; border: 1px solid #444; padding: 20px; border-radius: 6px; margin-bottom: 25px; }
        .table-custom { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        .table-custom th, .table-custom td { padding: 12px; text-align: left; border-bottom: 1px solid #444; }
        .table-custom th { background: #262423; color: var(--accent,#FE980F); }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .badge-pending { background: #ff9900; color: #000; }
        .badge-verified { background: #00cc66; color: #000; }

        .sub-title { color: #fff; font-size: 18px; margin-bottom: 15px; }
        .sub-title i { color: var(--accent,#FE980F); }
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
        .stat-card { background: #262423; border: 1px solid #444; border-radius: 6px; padding: 14px; }
        .stat-card h5 { font-size: 12px; color: #b3b1ae; font-weight: normal; margin-bottom: 6px; }
        .stat-card .num { font-size: 20px; font-weight: bold; color: #FFFFFF; }
        .stat-card .num.orange { color: var(--accent,#FE980F); }
        .stat-card .num.green { color: #00cc66; }
        .stat-card .num.red { color: #ff4d4d; }

        .chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .chart-box { background: #363432; border: 1px solid #444; border-radius: 6px; padding: 20px; }
        .chart-box h4 { font-size: 15px; margin-bottom: 15px; color: #fff; }
        .bars { display: flex; align-items: flex-end; gap: 8px; height: 150px; border-bottom: 1px solid #555; padding-bottom: 4px; }
        .bar-col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; }
        .bar { width: 100%; background: var(--accent,#FE980F); border-radius: 3px 3px 0 0; min-height: 3px; }
        .bar-labels { display: flex; gap: 8px; margin-top: 6px; }
        .bar-labels span { flex: 1; text-align: center; font-size: 11px; color: #b3b1ae; }
        .hbar-row { margin-bottom: 12px; font-size: 13px; }
        .hbar-row .top { display: flex; justify-content: space-between; margin-bottom: 4px; color: #ddd; }
        .hbar-track { background: #262423; border-radius: 4px; height: 10px; overflow: hidden; }
        .hbar-fill { background: var(--accent,#FE980F); height: 100%; border-radius: 4px; }
        .hbar-fill.green { background: #00cc66; }

        .alert-list { list-style: none; padding: 0; margin: 0; }
        .alert-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px; margin-bottom: 8px; background: #262423; border-radius: 6px; border-left: 4px solid var(--accent,#FE980F); font-size: 14px; }
        .alert-item.danger { border-left-color: #ff4d4d; }
        .alert-item.info { border-left-color: #4da6ff; }
        .alert-item .count { background: var(--accent,#FE980F); color: #000; font-weight: bold; border-radius: 12px; padding: 2px 10px; font-size: 12px; white-space: nowrap; }
        .alert-item.danger .count { background: #ff4d4d; color: #fff; }
        .alert-item.info .count { background: #4da6ff; color: #000; }
        .note-small { font-size: 12px; color: #b3b1ae; margin-top: 10px; }

        .tabs { display: flex; gap: 8px; overflow-x: auto; padding: 0 0 12px; margin-bottom: 20px; border-bottom: 1px solid #444; }
        .tab-btn { flex: 0 0 auto; background: #363432; color: #fff; border: 1px solid #444; border-radius: 20px; padding: 8px 14px; font-size: 13px; cursor: pointer; white-space: nowrap; }
        .tab-btn i { color: var(--accent,#FE980F); margin-right: 6px; }
        .tab-btn.on { background: var(--accent,#FE980F); color: #0D0D0D; border-color: var(--accent,#FE980F); }
        .tab-btn.on i { color: #0D0D0D; }
        .chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip { background: #262423; color: #fff; border: 1px solid #555; border-radius: 6px; padding: 8px 12px; font-size: 13px; cursor: pointer; }
        .chip:hover { border-color: var(--accent,#FE980F); color: var(--accent,#FE980F); }
        .flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
        .flow .step { background: #262423; border-left: 3px solid var(--accent,#FE980F); padding: 8px 12px; border-radius: 4px; font-size: 13px; }
        .flow .arrow { color: var(--accent,#FE980F); }
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
        .comm-form input { background: #262423; color: #fff; border: 1px solid #555; border-radius: 4px; padding: 8px; width: 90px; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--accent,#FE980F); color: #0D0D0D; padding: 10px 18px; border-radius: 6px; font-size: 14px; font-weight: bold; display: none; z-index: 99; max-width: 90%; text-align: center; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        #login { position: fixed; inset: 0; background: #0D0D0D; z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .lbox { background: #363432; border: 1px solid #444; border-top: 4px solid var(--accent,#FE980F); border-radius: 8px; padding: 28px; width: 100%; max-width: 360px; text-align: center; }
        .lbox h2 { margin-bottom: 6px; }
        .lbox h2 span { color: var(--accent,#FE980F); }
        .lbox input { width: 100%; box-sizing: border-box; margin: 8px 0; padding: 12px; background: #262423; color: #fff; border: 1px solid #555; border-radius: 4px; }
        .lbox button { width: 100%; margin-top: 8px; padding: 12px; background: var(--accent,#FE980F); color: #0D0D0D; border: 0; border-radius: 4px; font-weight: bold; cursor: pointer; }
        #lgMsg { color: #ff4d4d; font-size: 13px; min-height: 18px; }

        /* Separate admin login choices */
        .portal-choice {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 14px 0;
        }
        .portal-choice button {
            background: #262423;
            color: #fff;
            border: 1px solid #555;
            border-radius: 5px;
            padding: 11px 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            margin-top: 0;
            min-height: 48px;
        }
        .portal-choice button.selected {
            background: var(--accent,#FE980F);
            color: #0D0D0D;
            border-color: var(--accent,#FE980F);
        }
        .portal-choice button:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 2px;
        }

        .topbar { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; position: relative; flex-wrap: wrap; }
        .topbar input, .topbar select { background: #262423; color: #fff; border: 1px solid #555; border-radius: 6px; padding: 10px; }
        .topbar input { flex: 1; min-width: 180px; }
        .topbar button { background: #363432; color: #fff; border: 1px solid #555; border-radius: 6px; padding: 10px 14px; cursor: pointer; }
        #gsRes { display: none; position: absolute; top: 46px; left: 0; right: 0; background: #363432; border: 1px solid var(--accent,#FE980F); border-radius: 6px; z-index: 50; max-height: 260px; overflow-y: auto; }
        .sr { padding: 10px 12px; border-bottom: 1px solid #444; cursor: pointer; font-size: 14px; }
        .sr:hover { background: #262423; }
        .ta { width: 100%; box-sizing: border-box; background: #262423; color: #fff; border: 1px solid #555; border-radius: 4px; padding: 8px; font-family: inherit; }

        @media (max-width: 380px) {
            .lbox { padding: 20px 16px; }
            .portal-choice button { font-size: 11px; }
        }
    </style>
</head>
<body data-portal="admin">
    <div id="login">
        <div class="lbox">
            <h2 class="brand-swap" aria-label="Kisakali Shopping Mall and Impulse Cakes">
                <b class="brand-item brand-k" aria-hidden="true">KISAKALI<span>SHOPPING MALL</span></b>
                <b class="brand-item brand-i" aria-hidden="true">IMPULSE<span>CAKES</span></b>
            </h2>

            <p id="lgSub" style="color:#b3b1ae;margin-bottom:10px;">Kisakali Super Admin Secure Login</p>

            <div class="portal-choice" aria-label="Choose admin portal">
                <button type="button" id="kisakaliLogin" class="selected" aria-pressed="true">
                    <i class="fas fa-crown"></i> Kisakali Super Admin
                </button>
                <button type="button" id="impulseLogin" aria-pressed="false">
                    <i class="fas fa-cake-candles"></i> IMPULSE Admin
                </button>
            </div>

            <input id="lgU" type="email" placeholder="Admin email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
            <input id="lgP" type="password" placeholder="Password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false">
            <button id="lgB1" type="button">Sign in</button>
            <p id="lgMsg"></p>
            <p class="note-small">Admin accounts are created in Supabase and given the admin role. See BACKEND_SETUP.md.</p>
        </div>
    </div>

    <header>
        <div class="container header-container">
            <div class="logo">
                <h1>KISAKALI<span>SHOPPING MALL</span></h1>
                <p class="location-tag" style="color: #b3b1ae;"><i class="fas fa-crown" style="color: var(--accent,#FE980F);"></i> Super Admin Command Center</p>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="shop.html">Marketplace</a></li>
                    <li><a href="vendor.html">Vendor Panel</a></li>
                    <li><a href="driver.html">Rider Portal</a></li>
                    <li><a href="admin.html" class="active">Super Admin</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="container" style="padding: 40px 0;">
        <div class="topbar">
            <input id="gs" placeholder="Search order number, customer name or phone..." autocomplete="off">
            <select id="langSel">
                <option value="en">English</option>
                <option value="sw">Kiswahili</option>
            </select>
            <button id="logoutBtn" type="button">Logout</button>
        </div>
        <div id="adminRoot"></div>
    </section>

    <div class="toast" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script>
    /* second source in case the first one is blocked or slow */
    window.supabase || document.write('<script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"><\/script>');

    window.kxWhy = function () {
      var C = window.KISAKALI_CONFIG;
      if (!C || !C.SUPABASE_URL || !C.SUPABASE_ANON_KEY) return "supabase-config.js is missing or empty. Put the filled supabase-config.js in the same folder as admin.html, then refresh.";
      if (!window.supabase) return "The Supabase library could not load. Check your internet connection or ad-blocker, then refresh the page.";
      if (!window.KAPI) return "api.js did not load. Make sure api.js is in the same folder as admin.html (same place as supabase-config.js), then refresh.";
      return "The database is not connected. Check the URL and anon key in supabase-config.js.";
    };
    </script>

    <script src="supabase-config.js"></script>
    <script src="api.js"></script>
    <script>
    /* built-in copy: used only when api.js is not found next to this page */
    if (!window.KAPI) {
(function () {
  var C = window.KISAKALI_CONFIG || {};
  var live = !!(C.SUPABASE_URL && C.SUPABASE_ANON_KEY && window.supabase && window.supabase.createClient);
  var sb = live ? window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
  }) : null;

  function rpc(name, args) {
    if (!sb) return Promise.reject(new Error('The shop is not connected yet.'));
    return sb.rpc(name, args || {}).then(function (r) {
      if (r.error) throw new Error(r.error.message || 'Request failed');
      return r.data;
    });
  }

  window.KAPI = {
    live: live,
    sb: sb,
    rpc: rpc,
    placeOrder: function (payload) { return rpc('place_order', { p: payload }); },
    track: function (number, phone) { return rpc('track_order', { p_number: number, p_phone: phone }); },
    applyVendor: function (payload) { return rpc('submit_vendor_application', { p: payload }); },
    photoUrl: function (path) {
      if (!sb || !path) return '';
      return sb.storage.from('delivery-proofs').getPublicUrl(path).data.publicUrl;
    }
  };
})();
    }
    </script>

    <script src="brand.js"></script>
    <script src="admin-live.js"></script>

    <script>
(function () {
  function $(i) { return document.getElementById(i); }

  var UI = {
    en: {
      ph: "Search order number, customer name or phone...",
      out: "Logout",
      sub: "Admin Secure Login",
      u: "Admin email",
      p: "Password",
      c: "Sign in"
    },
    sw: {
      ph: "Tafuta namba ya oda, jina au simu ya mteja...",
      out: "Toka",
      sub: "Kuingia kwa Msimamizi",
      u: "Barua pepe",
      p: "Nenosiri",
      c: "Ingia"
    }
  };

  var lang = "en";
  var loginMode = "kisakali";

  try {
    lang = localStorage.getItem("kLang") || "en";
  } catch (e) {}

  if (!UI[lang]) lang = "en";

  function applyLang() {
    var u = UI[lang];

    $("gs").placeholder = u.ph;
    $("logoutBtn").textContent = u.out;
    $("lgU").placeholder = u.u;
    $("lgP").placeholder = u.p;
    $("lgB1").textContent = u.c;
    $("langSel").value = lang;

    updateLoginSubtitle();
  }

  function updateLoginSubtitle() {
    if (loginMode === "impulse") {
      $("lgSub").textContent = lang === "sw"
        ? "Kuingia kwa Admin wa IMPULSE"
        : "IMPULSE Admin Secure Login";
    } else {
      $("lgSub").textContent = lang === "sw"
        ? "Kuingia kwa Super Admin wa Kisakali"
        : "Kisakali Super Admin Secure Login";
    }
  }

  function msg(t) {
    $("lgMsg").textContent = t || "";
  }

  function chooseLogin(mode) {
    loginMode = mode;

    $("kisakaliLogin").classList.toggle("selected", mode === "kisakali");
    $("impulseLogin").classList.toggle("selected", mode === "impulse");

    $("kisakaliLogin").setAttribute("aria-pressed", mode === "kisakali" ? "true" : "false");
    $("impulseLogin").setAttribute("aria-pressed", mode === "impulse" ? "true" : "false");

    $("lgU").value = "";
    $("lgP").value = "";

    updateLoginSubtitle();
    msg("");
  }

  $("kisakaliLogin").addEventListener("click", function () {
    chooseLogin("kisakali");
  });

  $("impulseLogin").addEventListener("click", function () {
    chooseLogin("impulse");
  });

  $("langSel").addEventListener("change", function () {
    lang = this.value;

    try {
      localStorage.setItem("kLang", lang);
    } catch (e) {}

    applyLang();

    if (window.kLiveRedraw && $("login").style.display === "none") {
      kLiveRedraw();
    }
  });

  /* Supabase authentication */
  var sbA = window.KAPI && KAPI.live ? KAPI.sb : null;
  var lg = $("login");

  /*
   * Verify the authenticated account against its actual profile.
   * The selected button is only a portal selector; it does not grant permissions.
   */
  function go(d, legacy, expectedMode) {
    expectedMode = expectedMode || loginMode;

    if (!d || d.role !== "admin") {
      sbA.auth.signOut().then(function () {
        lg.style.display = "flex";
        msg("This account is not an admin account.");
      });
      return;
    }

    if (!legacy) {
      var validImpulse =
        d.brand === "impulse" &&
        d.admin_tier === "admin";

      var validKisakali =
        d.brand === "kisakali" &&
        d.admin_tier === "super";

      if (expectedMode === "impulse" && !validImpulse) {
        sbA.auth.signOut().then(function () {
          lg.style.display = "flex";
          msg("This is not an IMPULSE Admin account.");
        });
        return;
      }

      if (expectedMode === "kisakali" && !validKisakali) {
        sbA.auth.signOut().then(function () {
          lg.style.display = "flex";
          msg("This is not a Kisakali Super Admin account.");
        });
        return;
      }
    } else if (expectedMode === "impulse") {
      sbA.auth.signOut().then(function () {
        lg.style.display = "flex";
        msg("IMPULSE Admin account verification is unavailable. Contact Super Admin.");
      });
      return;
    }

    var tier = legacy ? "super" : d.admin_tier;
    var brand = legacy ? "kisakali" : d.brand;

    msg("");
    lg.style.display = "none";
    $("lgP").value = "";

    KBRAND.applyPortal(brand, tier);
    kLiveMount($("adminRoot"), {
      tier: tier,
      brand: brand
    });
  }

  /*
   * Load the profile and determine the selected portal.
   * Automatic session restoration uses the account's actual brand.
   */
  function enter(user, expectedMode) {
    sbA.from("profiles")
      .select("role,admin_tier,brand")
      .eq("id", user.id)
      .maybeSingle()
      .then(function (r) {
        if (!r.error) {
          var mode = expectedMode ||
            (r.data && r.data.brand === "impulse"
              ? "impulse"
              : "kisakali");

          go(r.data, false, mode);
          return;
        }

        /*
         * Old-schema fallback is allowed only for Kisakali.
         * IMPULSE must have the new profile fields verified.
         */
        sbA.from("profiles")
          .select("role")
          .eq("id", user.id)
          .maybeSingle()
          .then(function (r2) {
            go(r2.data, true, expectedMode || "kisakali");
          });
      })
      .catch(function () {
        lg.style.display = "flex";
        msg("Could not verify your admin profile. Please try again.");
      });
  }

  $("lgB1").addEventListener("click", function () {
    if (!sbA) {
      msg(kxWhy());
      return;
    }

    var email = $("lgU").value.trim();
    var pass = $("lgP").value;

    if (!/^\S+@\S+\.\S+$/.test(email) || !pass) {
      msg("Enter your email and password.");
      return;
    }

    var b = $("lgB1");
    b.disabled = true;
    msg("");

    sbA.auth.signInWithPassword({
      email: email,
      password: pass
    }).then(function (r) {
      b.disabled = false;

      if (r.error) {
        msg(/invalid login/i.test(r.error.message)
          ? "Wrong email or password."
          : r.error.message);
        return;
      }

      enter(r.data.user, loginMode);
    }).catch(function () {
      b.disabled = false;
      msg("Login failed. Please check your connection and try again.");
    });
  });

  [$("lgU"), $("lgP")].forEach(function (i) {
    i.addEventListener("keydown", function (e) {
      if (e.key === "Enter") $("lgB1").click();
    });
  });

  $("gs").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && window.kLiveSearch) {
      kLiveSearch(this.value);
    }
  });

  $("logoutBtn").addEventListener("click", function () {
    (sbA ? sbA.auth.signOut() : Promise.resolve())
      .then(function () {
        location.reload();
      });
  });

  applyLang();

  if (sbA) {
    sbA.auth.getSession().then(function (r) {
      if (r.data && r.data.session) {
        enter(r.data.session.user);
      }
    });
  } else {
    msg(kxWhy());
  }
})();
    </script>

    <script src="kx-extras.js"></script>
